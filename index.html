<body>
  <div class="loading-screen" id="loading-screen" aria-hidden="true">
    <div class="loading-moon"><span></span></div>
    <p>loading falter3d</p>
  </div>

  <div class="background-layer" aria-hidden="true"></div>
  <div class="background-noise" aria-hidden="true"></div>
  <div class="mouse-glow" id="mouse-glow" aria-hidden="true"></div>
  <div class="custom-cursor" id="custom-cursor" aria-hidden="true"><span></span></div>

  <header class="site-header" id="site-header">
    <a class="brand" href="#top" aria-label="falter3d home">
      <span class="brand-word">falter</span><span class="brand-accent">3d</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
    <nav class="main-nav" id="main-nav" aria-label="Main navigation"></nav>
    <a class="nav-contact" href="#contact">Discord <span>↗</span></a>
  </header>

  <main id="top">
    <section class="hero section-shell" id="home">
      <div class="hero-copy reveal">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-headline"></h1>
        <p class="hero-summary" id="hero-summary"></p>
        <div class="hero-actions" id="hero-actions"></div>
        <p class="hero-availability" id="hero-availability"></p>
      </div>
      <div class="hero-visual reveal" data-delay="100">
        <div class="profile-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
        <figure class="profile-frame" id="profile-admin-trigger">
          <img id="profile-image" src="assets/images/profile.webp" alt="falter3d profile artwork">
          <span class="profile-shine" aria-hidden="true"></span>
        </figure>
        <a class="presence-card" id="presence-card" href="https://discord.com/users/184491496291041280" target="_blank" rel="noopener">
          <span class="presence-avatar-wrap">
            <img id="presence-avatar" src="assets/images/favicon.png" alt="">
            <i class="presence-dot offline" id="presence-dot"></i>
          </span>
          <span class="presence-copy">
            <strong>falter3d</strong>
            <small id="presence-text">Checking Discord status…</small>
          </span>
          <span class="presence-arrow">↗</span>
        </a>
      </div>
      <a class="scroll-cue" href="#about" aria-label="Scroll to about"><span></span>scroll</a>
    </section>

    <div id="dynamic-sections"></div>
  </main>

  <footer class="site-footer">
    <div>
      <span class="footer-brand">falter3d</span>
      <span class="footer-note">Built for the things I actually do.</span>
    </div>
    <div class="footer-socials" id="footer-socials"></div>
    <button class="admin-moon" id="admin-moon" type="button" aria-label="Open site editor" title="Site editor">◐</button>
  </footer>

  <dialog class="project-modal" id="project-modal">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close project">×</button>
    <div id="project-modal-content"></div>
  </dialog>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <noscript>
    <div class="noscript">This portfolio needs JavaScript to load its configurable content.</div>
  </noscript>
